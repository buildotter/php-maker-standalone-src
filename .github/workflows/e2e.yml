name: e2e

on:
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    name: e2e

    strategy:
      matrix:
        include:
          - php: '8.1'
          - php: '8.2'
          - php: '8.3'
          - php: '8.4'
          - php: '8.5'

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Setup PHP (compilation)
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: "8.4"
          coverage: none

      - name: php version (compilation)
        run: php --version

      - name: Install dependencies
        run: composer install

      - name: Compile phar
        run: composer tools:run:compile-downgraded

      - name: Setup PHP (e2e)
        uses: shivammathur/setup-php@accd6127cb78bee3e8082180cb391013d204ef9f # v2.37.0
        with:
          php-version: "${{ matrix.php }}"
          coverage: none

      - name: php version (e2e)
        run: php --version

      - name: Run e2e tests
        run: composer tools:run:e2e
